name: monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The FRED series behind the macro context are DAILY, but this job runs every 15 min, and
      # fetching them from an Actions runner costs ~60s each (~5 min a run, delaying every alert).
      # Persist hlg.macro's own disk cache so only the first run of each UTC day pays for it; the
      # date in the key expires it, restore-keys lets a run fall back to yesterday's copy while
      # today's is still being fetched. A miss is harmless - macro_context degrades to no context.
      - id: day
        run: echo "utc=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache macro series (daily)
        uses: actions/cache@v4
        with:
          path: miner_cache
          key: macro-${{ steps.day.outputs.utc }}
          restore-keys: macro-
      - name: Run guardrails + scanner
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m hlg.report
      - name: Stamp site
        run: |
          cp -r pwa/. site/
          if [ -n "${{ vars.VAPID_PUBLIC_KEY }}" ]; then
            echo "window.VAPID_PUBLIC_KEY='${{ vars.VAPID_PUBLIC_KEY }}';" > site/config.js
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
