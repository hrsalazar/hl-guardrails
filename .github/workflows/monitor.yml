name: monitor

on:
  # GitHub's scheduler will not honour a 15-minute cron. Measured on this repo over 80 hours:
  # 22 scheduled runs instead of 321, median gap 235 min, and the shortest gap ever observed was
  # 121 min -- it never once fired at 15. Scheduled workflows are best-effort and short intervals
  # get deprioritised, so the cron here is only a backstop at an interval GitHub might actually
  # keep. Real cadence comes from an external scheduler calling the workflow_dispatch API
  # (README "Keeping the dashboard current"), which is exact and costs nothing.
  schedule:
    - cron: "17 * * * *"   # hourly, off the hour: on-the-hour slots are the most contended
  workflow_dispatch:
    inputs:
      test_push:
        description: "Also send a test notification to every subscribed device"
        type: boolean
        default: false
  push:
    branches: [main]

# No `issues: write`: alerts are no longer posted to an issue, which on a public repo made every
# position readable by anyone. Least privilege is the whole point of this job.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No macro step here on purpose: fred.stlouisfed.org read-times-out from Actions runners
      # (verified - 10/10 requests hit the 30s timeout, adding 300s to a job that runs every 15
      # minutes and producing nothing). config.yaml ships with scanner.macro_context off for that
      # reason; hlg.macro is for local research and backtests, where FRED answers fine.
      - name: Run guardrails + scanner
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Everything published is encrypted with this (hlg/vault.py). Without it the job
          # publishes a locked stub, never plaintext.
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          # The wallet stays out of the public repo; as a secret it is also masked in this log.
          HLG_ACCOUNT: ${{ secrets.HLG_ACCOUNT }}
          # This log is public on a public repo: print errors and explicitly-safe lines only.
          HLG_REDACT: "1"
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          HLG_TEST_PUSH: ${{ inputs.test_push }}
        run: python -m hlg.report
      - name: Stamp site
        run: |
          cp -r pwa/. site/
          if [ -n "${{ vars.VAPID_PUBLIC_KEY }}" ]; then
            echo "window.VAPID_PUBLIC_KEY='${{ vars.VAPID_PUBLIC_KEY }}';" > site/config.js
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
