name: monitor

on:
  # GitHub's scheduler will not honour a 15-minute cron. Measured on this repo over 80 hours:
  # 22 scheduled runs instead of 321, median gap 235 min, and the shortest gap ever observed was
  # 121 min -- it never once fired at 15. Scheduled workflows are best-effort and short intervals
  # get deprioritised, so the cron here is only a backstop at an interval GitHub might actually
  # keep. Real cadence comes from an external scheduler calling the workflow_dispatch API
  # (README "Keeping the dashboard current"), which is exact and costs nothing.
  schedule:
    - cron: "17 * * * *"   # hourly, off the hour: on-the-hour slots are the most contended
  workflow_dispatch:
    inputs:
      test_push:
        description: "Also send a test notification to every subscribed device"
        type: boolean
        default: false
      force_digest:
        description: "Regenerate the daily brief now (one paid model call)"
        type: boolean
        default: false
      restore_from_run:
        description: "Restore the state from the backup of this run id (docs/operations.md); leave empty normally"
        type: string
        default: ""
  push:
    branches: [main]

# No `issues: write`: alerts are no longer posted to an issue, which on a public repo made every
# position readable by anyone. Least privilege is the whole point of this job.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # only to download a state backup when restoring (restore_from_run)

# One run at a time (two would race on the published state). A new run REPLACES the one in progress:
# runs take under a minute and start 15 minutes apart, so this almost never cuts off a working run,
# but it clears one GitHub has left stuck -- e.g. "waiting" on the github-pages environment with
# nothing to approve, which once held the slot for 4.5 hours while every queued run was cancelled.
# (timeout-minutes can't catch that: a waiting run never starts executing.)
concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # A normal run takes under 1.5 minutes. One that hangs would hold the `monitor` concurrency slot,
    # and every run queued behind it is cancelled when the next one arrives (only one may wait).
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - if: inputs.restore_from_run != ''
        uses: actions/download-artifact@v8
        with:
          name: state-backup-${{ inputs.restore_from_run }}
          run-id: ${{ inputs.restore_from_run }}
          github-token: ${{ github.token }}
          path: prev
      # The macro backdrop reads FRED's official API (FRED_API_KEY below): the keyless download,
      # fred.stlouisfed.org/graph/fredgraph.csv, read-times-out from Actions runners (10/10 at 30s).
      - name: Run guardrails + scanner
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Everything published is encrypted with this (hlg/vault.py). Without it the job
          # publishes a locked stub, never plaintext.
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          # The wallet stays out of the public repo; as a secret it is also masked in this log.
          HLG_ACCOUNT: ${{ secrets.HLG_ACCOUNT }}
          # This log is public on a public repo: print errors and explicitly-safe lines only.
          HLG_REDACT: "1"
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          HLG_TEST_PUSH: ${{ inputs.test_push }}
          HLG_FORCE_DIGEST: ${{ inputs.force_digest }}
          # set only on a restore run: read the previous state from the downloaded backup, not the site
          HLG_PREV_DIR: ${{ inputs.restore_from_run != '' && 'prev' || '' }}
          # Daily macro brief (hlg.digest). Optional: either key works (OpenRouter preferred when both
          # are set); with neither, that step is skipped. Only public headlines and market data are
          # sent, never account data.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Macro backdrop (hlg.macro): FRED's official API, which answers from Actions (the keyless
          # download doesn't). Optional: without it the backdrop and the market state's macro leg are off.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m hlg.report
      - name: Stamp site
        run: |
          cp -r pwa/. site/
          if [ -n "${{ vars.VAPID_PUBLIC_KEY }}" ]; then
            echo "window.VAPID_PUBLIC_KEY='${{ vars.VAPID_PUBLIC_KEY }}';" > site/config.js
          fi
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub's OIDC token service occasionally times out ("Failed to get ID Token: Request timeout"),
      # which failed the whole run. One retry. It matters beyond the failure email: an undeployed run
      # means the next one reads the previous published state, and its new alerts get pushed twice.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # Rolling backup of what was just published -- state, history, alerts and the headline archive,
      # all ciphertext (hlg/vault.py) -- kept 30 days as a run artifact, from the runs in the 00:00 UTC
      # hour. Restore: docs/operations.md "Restoring the state from a backup".
      - id: when
        run: echo "hour=$(date -u +%H)" >> "$GITHUB_OUTPUT"
      - if: steps.when.outputs.hour == '00'
        uses: actions/upload-artifact@v7
        with:
          name: state-backup-${{ github.run_id }}
          path: |
            site/state.json
            site/history.json
            site/alerts.json
            site/news.json
          if-no-files-found: ignore
          retention-days: 30
      # Dead-man's switch (optional): ping a free healthchecks.io check after a deployed run; when the
      # pings stop, it emails you. Set the check's ping URL as the HEALTHCHECK_URL secret.
      - name: Health ping
        if: steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success'
        env:
          HC: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 --retry 3 "$HC" > /dev/null || echo "health ping failed"; fi
