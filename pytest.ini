[pytest]
# tests/e2e is a real-browser (Playwright) suite: it needs `playwright install chromium` and takes
# tens of seconds, so it stays out of the default `pytest -q` / CI run. Run it explicitly:
#   pip install -r requirements-e2e.txt && playwright install chromium && pytest tests/e2e -q
norecursedirs = tests/e2e .venv .git
markers =
    e2e: browser-driven UI test (tests/e2e); excluded from the default run by norecursedirs
