# Account being monitored. Read-only -- this tool never places, modifies, or cancels an order,
# and never needs a private key. The address is deliberately NOT here: this repo is public.
# CI reads the HLG_ACCOUNT secret; locally put `account: '0x...'` in config.local.yaml (gitignored).
account: null

poll_seconds: 60
state_file: state.json

rules:
  risk_per_trade_pct: 1.5        # max loss per position at stop, % of the equity base: USDC collateral
                                 # on a unified account, perp equity on a classic one (hlg/account.py)
  max_positions: 3
  max_same_direction: 2
  max_gross_exposure_x: 3.0      # perp notional / equity base. On a unified account the base is USDC
                                 # collateral, so this is exactly HL's "Unified Account Leverage".
  max_coin_exposure_x: 1.0       # perp + spot of the SAME coin, net, vs the base: flags a perp long
                                 # stacked on a spot bag as the one concentrated bet it is
  max_leverage: 5
  max_hold_days: 21
  daily_loss_limit_pct: 3.0      # vs start-of-day value: whole account (spot incl.) when unified,
                                 # perps only on a classic account where spot is a separate wallet
  weekly_loss_limit_pct: 6.0
  allowed_coins: [BTC, ETH, SOL, HYPE, XRP, NEAR, DOGE, LINK, SUI, ZEC, PENDLE, AVAX]   # or: auto (= today's scanner universe)
  no_add_underwater: true

scanner:
  strategy: breakout   # breakout (backtested, long-only) | pullback (legacy, tested negative)
  timeframes: [1d, 4h]  # breakout runs independently on each (both backtested, see README "Timeframe")
  coins: [BTC, ETH, SOL, HYPE, XRP, NEAR, DOGE, LINK, SUI, ZEC, PENDLE, AVAX]   # used when universe.mode = fixed
  # AVAX added 2026-09-23 on your own market-phase read, not because it cleared the candidate-study
  # bar (README "Universe": its out-of-sample profit factor alone was ~0, same fragility as
  # INJ/TAO/FET) - noted here so a future look at the README doesn't read this as a backtest result
  # Which coins to scan. auto = the top_n perps by 30-day median daily volume (listed >= min_age_days,
  # OI >= min_oi_usd), rebuilt once per UTC day - the rule `python -m hlg.backtest --universe-study`
  # tests (README "Universe"). In auto mode momentum watches every perp >= min_vol_usd, not only top_n.
  universe:
    mode: fixed
    top_n: 30
    min_vol_usd: 10000000
    min_oi_usd: 5000000
    min_age_days: 60
    include: []      # always scanned, liquid or not
    exclude: []      # never scanned
  watch_coins: [xyz:CL, xyz:GOLD, xyz:XYZ100]   # tradfi perps, dashboard only - no alerts (short history, PF ~1.2)
  # Macro/TradFi section of the dashboard. HL's own tradfi perps, so this works from Actions -
  # unlike FRED below. Dead listings (xyz:DXY, xyz:VIX, xyz:CORN... all sit at 0 OI / 0 volume
  # with a frozen mark) are filtered out by hlg.market, not listed here. Context only, gates nothing.
  tradfi_coins: [xyz:SP500, xyz:GOLD, xyz:SILVER, xyz:CL, xyz:COPPER, xyz:NATGAS, xyz:EUR, xyz:JPY, xyz:MSTR, xyz:COIN]
  interval_minutes: 30
  stop_atr: 2.0
  trail_atr: 3.0
  # 3-7d swing: daily trend (EMA20 vs EMA50) + 4h pullback (RSI) + proximity to 20d extreme
  rsi_long_max: 35
  rsi_short_min: 65
  level_proximity_pct: 3.0       # price within X% of 20-day high/low
  min_rr: 2.0
  prefer_short_when_funding_positive: true
  funding_carry_alert_apr: 20    # dashboard note if |annualised funding| > this % (never pushed)
  # fast heads-up for moves too quick for 1d/4h breakout levels to confirm (e.g. a sharp 1h spike) -
  # NOT a backtested setup (1h breakout PF 1.16 / -44% max DD on ~7mo of history - too weak to trade on,
  # see hlg.backtest --interval 1h --native), so this alerts with no stop/size/target, just a nudge to look.
  momentum_window_hours: 4
  momentum_alert_pct: 8          # alert if price moved more than this % within momentum_window_hours
  # Macro backdrop (FRED, no key) shown on alerts and the dashboard. Context ONLY - it gates nothing:
  # every risk-on filter tested worse than dropping the same trades at random (README "Macro").
  # OFF by default because FRED read-times-out from GitHub Actions runners, so the scheduled
  # monitor would burn 300s a run for nothing. Turn it on when running the scanner locally.
  macro_context: false

# Flow section: recent liquidations from OKX (Hyperliquid publishes none - no endpoint exists).
# These are RECENT events, not 24h totals, and they are OKX's book rather than HL's. One request
# per coin, so the list stays short; the whole call is capped by budget_s and degrades to nothing
# rather than delaying alerts. If it comes back empty the dashboard fetches OKX itself.
flow:
  enabled: true
  liquidation_coins: [BTC, ETH, SOL]   # majors only: HYPE/PENDLE/ZEC are not listed on OKX
  budget_s: 10

# Liquidation levels from the largest Hyperliquid accounts' public positions (hlg.liqmap): real
# liquidation prices, not an estimate. Context only - gates nothing; the signal journal records it
# at every breakout so the "clusters are magnets" idea can be tested. Refreshed every few hours after
# alerts are pushed (~25s for ~560 accounts), so it never delays a notification.
liqmap:
  enabled: true
  accounts_by_value: 200   # largest leaderboard accounts (mostly low leverage: liquidation far away)
  accounts_by_volume: 400  # most active by weekly volume - where the near-price leverage is (list refreshed daily)
  refresh_hours: 4
  band_pct: 1.0          # cluster width, % of price
  range_pct: 15          # ignore liquidation prices further than this from the price

# Scheduled high-impact releases (hlg.events): FOMC from federalreserve.gov, everything else from the
# free weekly FairEconomy calendar. A heads-up is PUSHED once when a release is within warn_hours,
# naming any open positions; breakout alerts note one too. Context, not a rule.
events:
  enabled: true
  warn_hours: 24
  countries: [USD]
  impacts: [High]
  refresh_hours: 6       # the weekly feed rate-limits hard; a failed fetch retries after an hour

# Daily macro + crypto brief (hlg.digest): ~70 public headlines from central-bank, markets and crypto
# RSS feeds, summarised by Claude once a UTC day into a few points and a risk tilt. Needs the
# ANTHROPIC_API_KEY secret (skipped without it); ~a few cents a day. Only public data goes into the
# prompt - never the address, positions or PnL. Reading material: not backtestable (no free
# headline archive), never pushed, gates nothing. Feeds: see hlg/digest.py FEEDS.
digest:
  enabled: true
  hour_utc: 6            # first run after this hour; 06:00 UTC = after Asia, before Europe and US data
  model: claude-sonnet-5
  lookback_hours: 30

telegram:
  enabled: false                 # set TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID env vars

# python -m hlg.miner : mine setups from similar-capital discretionary winners on the leaderboard
miner:
  equity_min: 500
  equity_max: 50000
  windows_positive: [month, allTime]
  wallets: 120            # kept wallets target (3x this many are screened)
  lookback_days: 180
  min_trades: 40
  max_trades_per_day: 15  # above -> HFT/bot
  max_maker_share: 0.6    # above -> market maker
  min_median_hold_h: 2    # below -> scalper
  min_wallets_per_setup: 5
