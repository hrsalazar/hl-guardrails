# Account being monitored (public address). Read-only unless HL_PRIVATE_KEY is set and mode=enforce.
account: "0x68b18d388994336f341b4997360bb45f9f8701c9"

# alert  -> only warn (console + Telegram)
# enforce -> place missing stops, trim adds-underwater, flatten on time stop / loss limits
mode: alert
poll_seconds: 60
state_file: state.json

rules:
  risk_per_trade_pct: 1.5        # max loss per position at stop, % of perp equity
  max_positions: 3
  max_same_direction: 2
  max_gross_exposure_x: 3.0      # sum(|notional|) / equity
  max_leverage: 5
  max_hold_days: 21
  daily_loss_limit_pct: 3.0      # realized+unrealized vs start-of-day equity
  weekly_loss_limit_pct: 6.0
  allowed_coins: [BTC, ETH, SOL, HYPE, XRP, NEAR, DOGE, LINK, SUI, ZEC, PENDLE]
  no_add_underwater: true

scanner:
  strategy: breakout   # breakout (backtested, long-only) | pullback (legacy, tested negative)
  coins: [BTC, ETH, SOL, HYPE, XRP, NEAR, DOGE, LINK, SUI, ZEC, PENDLE]
  watch_coins: [xyz:CL, xyz:GOLD, xyz:XYZ100]   # tradfi perps, dashboard only - no alerts (short history, PF ~1.2)
  interval_minutes: 30
  stop_atr: 2.0
  trail_atr: 3.0
  # 3-7d swing: daily trend (EMA20 vs EMA50) + 4h pullback (RSI) + proximity to 20d extreme
  rsi_long_max: 35
  rsi_short_min: 65
  level_proximity_pct: 3.0       # price within X% of 20-day high/low
  min_rr: 2.0
  prefer_short_when_funding_positive: true
  funding_carry_alert_apr: 20    # alert if |annualised funding| > this %

telegram:
  enabled: false                 # set TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID env vars

# python -m hlg.miner : mine setups from similar-capital discretionary winners on the leaderboard
miner:
  equity_min: 500
  equity_max: 50000
  windows_positive: [month, allTime]
  wallets: 120            # kept wallets target (3x this many are screened)
  lookback_days: 180
  min_trades: 40
  max_trades_per_day: 15  # above -> HFT/bot
  max_maker_share: 0.6    # above -> market maker
  min_median_hold_h: 2    # below -> scalper
  min_wallets_per_setup: 5
